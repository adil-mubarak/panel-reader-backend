services:
  panel-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.local
    environment:
      PANEL_AI_PROVIDER: local
      ROBOFLOW_API_KEY: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)); assert response.get('status') == 'ok' and response.get('modelConfigured') is True"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
